[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-webdav-wrapper"
version = "2.0.0"
description = "Read-only WebDAV interface for Immich albums"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "cheroot",
    "python-dateutil",
    "python-dotenv",
    "requests",
    "wsgidav",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "responses",
    "ruff",
]

[project.scripts]
immich-webdav = "immich_webdav.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true